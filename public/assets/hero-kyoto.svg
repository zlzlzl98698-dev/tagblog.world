<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kyotoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2F1"/>
      <stop offset="50%" stop-color="#B2DFDB"/>
      <stop offset="100%" stop-color="#4DB6AC"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景柔光圆形 -->
  <circle cx="200" cy="200" r="170" fill="url(#kyotoGrad)" opacity="0.35" filter="url(#softGlow)"/>
  <circle cx="200" cy="200" r="145" fill="#FFFDF8" stroke="#B2DFDB" stroke-width="2"/>

  <!-- 日式木窗格栅外框 -->
  <rect x="90" y="90" width="220" height="220" rx="12" fill="none" stroke="url(#woodGrad)" stroke-width="8"/>
  <rect x="98" y="98" width="204" height="204" rx="6" fill="#FFFDF8" opacity="0.9"/>

  <!-- 窗格十字横竖条 -->
  <line x1="200" y1="90" x2="200" y2="310" stroke="url(#woodGrad)" stroke-width="6"/>
  <line x1="90" y1="200" x2="310" y2="200" stroke="url(#woodGrad)" stroke-width="6"/>
  <line x1="145" y1="98" x2="145" y2="302" stroke="#D7CCC8" stroke-width="2"/>
  <line x1="255" y1="98" x2="255" y2="302" stroke="#D7CCC8" stroke-width="2"/>
  <line x1="98" y1="145" x2="302" y2="145" stroke="#D7CCC8" stroke-width="2"/>
  <line x1="98" y1="255" x2="302" y2="255" stroke="#D7CCC8" stroke-width="2"/>

  <!-- 飘落的青翠竹叶与枫叶 -->
  <path d="M120 70 C150 60 170 90 140 100 C120 105 100 85 120 70 Z" fill="#4DB6AC" opacity="0.9"/>
  <path d="M290 85 C320 75 330 110 305 115 C285 120 270 95 290 85 Z" fill="#26A69A" opacity="0.85"/>
  <path d="M280 270 C310 260 325 290 300 300 C275 305 265 280 280 270 Z" fill="#80CBC4" opacity="0.9"/>

  <!-- 科技光斑网络节点 (暗示网络可观测性) -->
  <circle cx="200" cy="200" r="7" fill="#00897B"/>
  <circle cx="200" cy="200" r="14" fill="none" stroke="#4DB6AC" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="150" cy="160" r="4" fill="#4DB6AC"/>
  <circle cx="250" cy="160" r="4" fill="#4DB6AC"/>
  <circle cx="160" cy="240" r="4" fill="#4DB6AC"/>
  <circle cx="240" cy="240" r="4" fill="#4DB6AC"/>
  <line x1="200" y1="200" x2="150" y2="160" stroke="#80CBC4" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="200" y1="200" x2="250" y2="160" stroke="#80CBC4" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="200" y1="200" x2="160" y2="240" stroke="#80CBC4" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="200" y1="200" x2="240" y2="240" stroke="#80CBC4" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- 印章手札印记 -->
  <rect x="182" y="325" width="36" height="36" rx="4" fill="#C62828" opacity="0.85"/>
  <text x="200" y="348" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFDF8" text-anchor="middle">TAG</text>
</svg>
